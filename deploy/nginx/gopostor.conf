# Nginx front end for the gopostor matchmaking gateway.
#
# Install: copy to /etc/nginx/conf.d/gopostor.conf (it is included inside the http block),
# replace every matchmaker.example.com with your domain, then: sudo nginx -t && sudo systemctl reload nginx
#
# Among Us only talks HTTP(S) to this server: game traffic is UDP and goes straight to the Impostor
# instances (publicIp/publicPort in gopostor's config.json), Nginx is not involved in it.

upstream gopostor {
    server 127.0.0.1:24000;   # listenIp/listenPort in gopostor's config.json
    keepalive 16;
}

# Per client address. Lobby browsing polls, players behind one NAT share an address: keep this generous.
limit_req_zone $binary_remote_addr zone=gopostor_req:10m rate=20r/s;

# Access log: method/path/status and upstream timings. gopostor itself logs the
# full request and response body, including the matchmaking token, so protect both logs.
log_format gopostor '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time ua="$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name matchmaker.example.com;

    access_log /var/log/nginx/gopostor.access.log gopostor;
    error_log  /var/log/nginx/gopostor.error.log warn;

    # Let's Encrypt renewals (certbot --webroot -w /var/www/certbot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # No redirect to HTTPS: a redirected POST/PUT turns into a GET and matchmaking breaks.
    # PC region files using http:// keep working, phones use the HTTPS server below.
    location / {
        include /etc/nginx/conf.d/gopostor.proxy.inc;
    }

    location = /healthz {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://gopostor;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name matchmaker.example.com;

    ssl_certificate     /etc/letsencrypt/live/matchmaker.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matchmaker.example.com/privkey.pem;

    # Mozilla "intermediate": TLS 1.2 is still needed by older Unity/mobile clients.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:gopostor_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # No OCSP stapling: Let's Encrypt certificates no longer carry an OCSP URL.

    access_log /var/log/nginx/gopostor.access.log gopostor;
    error_log  /var/log/nginx/gopostor.error.log warn;

    location / {
        include /etc/nginx/conf.d/gopostor.proxy.inc;
    }

    location = /healthz {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://gopostor;
    }
}
